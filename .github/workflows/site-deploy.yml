name: Deploy website
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: whatsrusty-site-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.CLOUDFLARE_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm run typecheck --prefix site
      - run: npm run deploy --prefix site
      - run: curl --fail --retry 5 --retry-delay 3 https://whatsapp.apps.balaj.me/
