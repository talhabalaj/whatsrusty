[package]
name = "whatsapp-gpui"
edition.workspace = true
version.workspace = true

[[bin]]
name = "whatsapp-gpui"
path = "src/main.rs"

[dependencies]
wa-backend.workspace = true
anyhow.workspace = true
flume.workspace = true
log.workspace = true
gpui-kit = "0.8.1"
chrono = "0.4"
serde_json = "1"
emojis = "0.9"
unicode-segmentation = "1"
# CLDR keywords ("laugh", "lol"…) so each emoji matches more than its shortcode.
emoji = { version = "0.2.1", default-features = false, features = ["en"] }
linkify = "0.10"
url = "2.5"
qrcode = { version = "0.14", default-features = false }
dirs = "6"
env_logger = "0.11"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSGeometry", "NSNotification", "NSOperation", "block2", "NSBundle", "NSError", "NSDistributedNotificationCenter"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder", "NSGraphics", "NSScreen", "block2", "NSApplication", "NSDockTile", "NSAppearance", "NSEvent", "NSMenu", "NSMenuItem", "NSWorkspace"] }
objc2-av-kit = { version = "0.3", default-features = false, features = ["std", "AVPlayerView", "objc2-app-kit", "objc2-av-foundation"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVPlayer", "AVPlayerItem", "AVAsset", "AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "0.6"
raw-window-handle = "0.6"
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "block2", "AVAudioEngine", "AVAudioNode", "AVAudioIONode", "AVAudioBuffer", "AVAudioFormat", "AVAudioTime", "AVAudioTypes", "AVAudioMixing", "AVAudioChannelLayout"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "wav"] }
# Only for the `snapshots` feature (gpui-kit's own test-support pulls in a conflicting gpui-fast).
gpui-pre = { version = "0.3.10", optional = true, features = ["test-support"] }
gpui-pre-macos = { version = "0.3.10", optional = true, features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[features]
# Debug builds whose WA_DEBUG_UI script can save window snapshots ("shot <file.png>"),
# rendered offscreen, so they work with the screen locked.
snapshots = ["dep:gpui-pre", "dep:gpui-pre-macos"]
