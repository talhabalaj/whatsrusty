[package]
name = "wa-backend"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
flume.workspace = true
log.workspace = true
# `simd` (a default feature) needs nightly; everything else from the defaults.
whatsapp-rust = { version = "0.7", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rusqlite = { version = "0.39", features = ["bundled"] }
ogg = "0.9"
# Voice notes in and out: libopus built from its vendored source (static, no system lib).
opus-codec = "0.2"
# Thumbnails/dimensions for sent photos.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
env_logger = "0.11"
