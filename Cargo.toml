[workspace]
resolver = "3"
members = ["crates/wa-backend", "crates/app"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
wa-backend = { path = "crates/wa-backend" }
anyhow = "1"
flume = "0.11"
log = "0.4"

[patch.crates-io]
# Skips a startup font enumeration that blocks the UI for seconds on macOS.
# See vendor/gpui-component/src/theme/system_font.rs (search "whatsapp-gpui patch").
gpui-component = { path = "vendor/gpui-component" }
# Editor text exposed to accessibility (text runs, caret, character count) so macOS
# AX clients such as dictation apps can read and confirm insertions.
# See vendor/gpui-base/src/input/base/a11y_text.rs (search "whatsapp-gpui patch").
gpui-base = { path = "vendor/gpui-base" }
# gpui-pre, gpui-pre-apple, gpui-pre-macos (search "whatsapp-gpui patch"):
# - In-window backdrop blur: a `BackdropBlur` scene primitive and `Window::paint_backdrop_blur`,
#   drawn by the Metal renderer (vendor/gpui-pre/src/scene.rs, gpui-pre-apple/src/metal_renderer.rs).
# - Liquid Glass panes: parts of a scene rendered into separate Metal surfaces hosted in
#   NSGlassEffectViews. See docs/liquid-glass.md.
# - AccessKit attached to the first-responder GPUI view so the focused text field is the
#   system's AXFocusedUIElement (vendor/gpui-pre-macos/src/window.rs).
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
